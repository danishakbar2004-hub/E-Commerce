<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <!-- Top Banner -->
  <rect width="1200" height="56" fill="#1E293B"/>
  <rect x="24" y="14" width="28" height="28" rx="6" fill="#0078D4"/>
  <text x="31" y="34" font-family="Segoe UI, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">🌍</text>
  <text x="64" y="34" font-family="Segoe UI, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">Regional Sales Distribution &amp; Logistics SLA Performance</text>
  <text x="64" y="48" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Brazilian State Share, Delivery Lead Times &amp; Cross-State Trade Flows</text>

  <!-- Left: State Revenue Ranking -->
  <rect x="24" y="80" width="560" height="380" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="110" font-family="Segoe UI, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">Delivered Product Revenue by State</text>
  <text x="44" y="145" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">SP (São Paulo)</text>
  <rect x="180" y="132" width="340" height="18" fill="#0078D4" rx="3"/>
  <text x="525" y="145" font-family="Segoe UI, sans-serif" font-size="10" fill="#0078D4" font-weight="bold">$5.07M (38.3%)</text>

  <text x="44" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">RJ (Rio de Janeiro)</text>
  <rect x="180" y="167" width="118" height="18" fill="#0078D4" rx="3"/>
  <text x="305" y="180" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B" font-weight="bold">$1.76M (13.3%)</text>

  <text x="44" y="215" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">MG (Minas Gerais)</text>
  <rect x="180" y="202" width="104" height="18" fill="#0078D4" rx="3"/>
  <text x="290" y="215" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B" font-weight="bold">$1.55M (11.7%)</text>

  <text x="44" y="250" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">RS (Rio Grande Sul)</text>
  <rect x="180" y="237" width="49" height="18" fill="#0078D4" rx="3"/>
  <text x="235" y="250" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B" font-weight="bold">$729K (5.5%)</text>

  <text x="44" y="285" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">PR (Paraná)</text>
  <rect x="180" y="272" width="45" height="18" fill="#0078D4" rx="3"/>
  <text x="230" y="285" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B" font-weight="bold">$666K (5.0%)</text>

  <text x="44" y="320" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">BA (Bahia)</text>
  <rect x="180" y="307" width="33" height="18" fill="#0078D4" rx="3"/>
  <text x="218" y="320" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B" font-weight="bold">$490K (3.7%)</text>

  <rect x="44" y="360" width="500" height="75" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="60" y="385" font-family="Segoe UI, sans-serif" font-size="11" fill="#1E40AF" font-weight="bold">Southeast Revenue Concentration: 63.38% ($8.38M)</text>
  <text x="60" y="405" font-family="Segoe UI, sans-serif" font-size="10" fill="#1E3A8A">São Paulo, Rio de Janeiro, and Minas Gerais anchor nearly two-thirds of demand.</text>
  <text x="60" y="423" font-family="Segoe UI, sans-serif" font-size="10" fill="#1E3A8A">Logistics routes radiating from SP define fulfillment speed across Brazil.</text>

  <!-- Right: Delivery SLA by State -->
  <rect x="608" y="80" width="568" height="380" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="628" y="110" font-family="Segoe UI, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">Average Delivery Lead Time (Days)</text>
  <!-- SLA Bars -->
  <text x="628" y="145" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">SP (Metro Hub)</text>
  <rect x="750" y="132" width="130" height="18" fill="#10B981" rx="3"/>
  <text x="890" y="145" font-family="Segoe UI, sans-serif" font-size="10" fill="#065F46" font-weight="bold">8.3 Days (95.4% on-time)</text>

  <text x="628" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">PR (South Hub)</text>
  <rect x="750" y="167" width="180" height="18" fill="#10B981" rx="3"/>
  <text x="940" y="180" font-family="Segoe UI, sans-serif" font-size="10" fill="#065F46" font-weight="bold">11.5 Days</text>

  <text x="628" y="215" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">MG (Southeast)</text>
  <rect x="750" y="202" width="180" height="18" fill="#10B981" rx="3"/>
  <text x="940" y="215" font-family="Segoe UI, sans-serif" font-size="10" fill="#065F46" font-weight="bold">11.5 Days</text>

  <text x="628" y="250" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">RJ (Southeast)</text>
  <rect x="750" y="237" width="230" height="18" fill="#F59E0B" rx="3"/>
  <text x="990" y="250" font-family="Segoe UI, sans-serif" font-size="10" fill="#92400E" font-weight="bold">14.8 Days</text>

  <text x="628" y="285" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">BA (Northeast)</text>
  <rect x="750" y="272" width="240" height="18" fill="#F59E0B" rx="3"/>
  <text x="1000" y="285" font-family="Segoe UI, sans-serif" font-size="10" fill="#92400E" font-weight="bold">15.3 Days</text>

  <text x="628" y="320" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">PE (Northeast)</text>
  <rect x="750" y="307" width="270" height="18" fill="#EF4444" rx="3"/>
  <text x="1030" y="320" font-family="Segoe UI, sans-serif" font-size="10" fill="#991B1B" font-weight="bold">17.2 Days</text>

  <text x="628" y="355" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">CE (Northeast)</text>
  <rect x="750" y="342" width="320" height="18" fill="#EF4444" rx="3"/>
  <text x="1080" y="355" font-family="Segoe UI, sans-serif" font-size="10" fill="#991B1B" font-weight="bold">20.4 Days (84.1% on-time)</text>

  <!-- Bottom: Logistics Diagnostic -->
  <rect x="24" y="480" width="1152" height="175" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="510" font-family="Segoe UI, sans-serif" font-size="13" fill="#0F172A" font-weight="bold">Logistics SLA Insights &amp; Geographic Distance Penalty</text>
  <text x="44" y="535" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">● São Paulo Fulfillment Efficiency: 8.3-day average delivery duration and 95.4% on-time rate lead all territories.</text>
  <text x="44" y="560" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">● Geographic Disparity: Northeastern buyers (CE, PE) wait more than 2.4x longer (17-20+ days) and pay 28% higher freight fees.</text>
  <text x="44" y="585" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">● Merchant Hubs vs Buyer Demand: 70%+ of merchants are located in SP/PR, creating a net export imbalance toward distant consumer states.</text>
</svg>
