  <text x="630" y="166" font-family="Segoe UI, sans-serif" font-size="26" fill="#0F172A" font-weight="bold">$137.04</text>
  <text x="630" y="188" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B">Gross Basket: $160.20 w/ freight</text>

