  <text x="1020" y="32" font-family="Segoe UI, sans-serif" font-size="11" fill="#10B981" font-weight="bold">● Production Model Verified</text>

  <!-- Filter Ribbon -->
  <rect y="56" width="1200" height="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
