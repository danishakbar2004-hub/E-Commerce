  <rect x="515" y="252" width="24" height="198" fill="#0078D4" rx="2"/>
  <rect x="550" y="240" width="24" height="210" fill="#0078D4" rx="2"/>
  <rect x="585" y="238" width="24" height="212" fill="#0078D4" rx="2"/>
  <rect x="620" y="235" width="24" height="215" fill="#0078D4" rx="2"/>
  <rect x="655" y="248" width="24" height="202" fill="#0078D4" rx="2"/>
  <rect x="690" y="244" width="24" height="206" fill="#0078D4" rx="2"/>
  <rect x="725" y="235" width="24" height="215" fill="#0078D4" rx="2"/>

  <!-- Chart 2: Payment Donut -->
  <rect x="808" y="220" width="368" height="260" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="826" y="246" font-family="Segoe UI, sans-serif" font-size="13" fill="#0F172A" font-weight="bold">Revenue by Payment Method</text>
  <circle cx="940" cy="350" r="65" fill="none" stroke="#0078D4" stroke-width="28" stroke-dasharray="310 100"/>
  <circle cx="940" cy="350" r="65" fill="none" stroke="#10B981" stroke-width="28" stroke-dasharray="80 330" stroke-dashoffset="-310"/>
  <circle cx="940" cy="350" r="65" fill="none" stroke="#F59E0B" stroke-width="28" stroke-dasharray="18 392" stroke-dashoffset="-390"/>
  <text x="922" y="355" font-family="Segoe UI, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">75.8%</text>
  <text x="915" y="370" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748B">Credit Card</text>
  <text x="1030" y="325" font-family="Segoe UI, sans-serif" font-size="11" fill="#0078D4" font-weight="bold">■ Credit Card (75.8%)</text>
  <text x="1030" y="345" font-family="Segoe UI, sans-serif" font-size="11" fill="#10B981" font-weight="bold">■ Boleto Voucher (19.4%)</text>
  <text x="1030" y="365" font-family="Segoe UI, sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">■ Vouchers Split (3.8%)</text>
  <text x="1030" y="385" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748B" font-weight="bold">■ Debit Card (1.0%)</text>

  <!-- Bottom Table Summary -->
  <rect x="24" y="496" width="1152" height="155" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="42" y="522" font-family="Segoe UI, sans-serif" font-size="12" fill="#0F172A" font-weight="bold">Top Category Drivers &amp; Operational Benchmarks</text>
  <line x1="42" y1="535" x2="1150" y2="535" stroke="#E2E8F0"/>
  <text x="42" y="555" font-family="Segoe UI, sans-serif" font-size="11" fill="#0078D4" font-weight="bold">1. Health &amp; Beauty</text>
  <text x="240" y="555" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">$1.26M Revenue (9.52% share) | 9,670 units | 4.18 ★</text>
  <text x="42" y="580" font-family="Segoe UI, sans-serif" font-size="11" fill="#0078D4" font-weight="bold">2. Watches &amp; Gifts</text>
  <text x="240" y="580" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">$1.21M Revenue (9.11% share) | High AOV: $201.14 | 4.02 ★</text>
  <text x="42" y="605" font-family="Segoe UI, sans-serif" font-size="11" fill="#0078D4" font-weight="bold">3. Bed, Bath &amp; Table</text>
  <text x="240" y="605" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">$1.04M Revenue (7.84% share) | Volume Leader: 11,115 units | 3.92 ★</text>
  <text x="42" y="630" font-family="Segoe UI, sans-serif" font-size="11" fill="#0078D4" font-weight="bold">Regional Concentration:</text>
  <text x="240" y="630" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Top 3 states (SP 38.3%, RJ 13.3%, MG 11.7%) contribute 63.38% of platform GMV</text>
