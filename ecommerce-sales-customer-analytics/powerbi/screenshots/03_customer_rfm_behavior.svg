<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <!-- Top Banner -->
  <rect width="1200" height="56" fill="#1E293B"/>
  <rect x="24" y="14" width="28" height="28" rx="6" fill="#0078D4"/>
  <text x="31" y="34" font-family="Segoe UI, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">👥</text>
  <text x="64" y="34" font-family="Segoe UI, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">Customer Retention &amp; RFM Behavioral Segmentation</text>
  <text x="64" y="48" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Recency, Frequency, Monetary Quintiles &amp; Activation Strategy</text>

  <!-- Left Donut: Retention Rate -->
  <rect x="24" y="80" width="380" height="380" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="110" font-family="Segoe UI, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">Repeat vs One-Time Buyers</text>
  <circle cx="214" cy="240" r="85" fill="none" stroke="#CBD5E1" stroke-width="36" stroke-dasharray="518 20"/>
  <circle cx="214" cy="240" r="85" fill="none" stroke="#0078D4" stroke-width="36" stroke-dasharray="16 522" stroke-dashoffset="-518"/>
  <text x="180" y="240" font-family="Segoe UI, sans-serif" font-size="24" fill="#0F172A" font-weight="bold">3.00%</text>
  <text x="160" y="260" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B">Repeat Buyers (2,801)</text>

  <rect x="44" y="380" width="340" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="56" y="405" font-family="Segoe UI, sans-serif" font-size="11" fill="#0F172A" font-weight="bold">One-Time Buyers: 90,557 (97.00%)</text>
  <text x="56" y="425" font-family="Segoe UI, sans-serif" font-size="10" fill="#EF4444" font-weight="600">Critical Retention Bottleneck Identified</text>

  <!-- Right: RFM Distribution Bar -->
  <rect x="424" y="80" width="752" height="380" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="444" y="110" font-family="Segoe UI, sans-serif" font-size="14" fill="#0F172A" font-weight="bold">RFM Customer Count Distribution</text>
  
  <!-- Bars -->
  <rect x="460" y="260" width="80" height="150" fill="#10B981" rx="4"/>
  <text x="480" y="250" font-family="Segoe UI, sans-serif" font-size="10" fill="#065F46" font-weight="bold">1,850</text>
  <text x="465" y="430" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">Champions</text>

  <rect x="580" y="210" width="80" height="200" fill="#0078D4" rx="4"/>
  <text x="600" y="200" font-family="Segoe UI, sans-serif" font-size="10" fill="#1E40AF" font-weight="bold">5,420</text>
  <text x="575" y="430" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">Loyal Cust.</text>

  <rect x="700" y="170" width="80" height="240" fill="#60A5FA" rx="4"/>
  <text x="720" y="160" font-family="Segoe UI, sans-serif" font-size="10" fill="#1D4ED8" font-weight="bold">9,840</text>
  <text x="690" y="430" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">Potential Loyal</text>

  <rect x="820" y="130" width="80" height="280" fill="#93C5FD" rx="4"/>
  <text x="835" y="120" font-family="Segoe UI, sans-serif" font-size="10" fill="#1E3A8A" font-weight="bold">19,200</text>
  <text x="815" y="430" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">New Customers</text>

  <rect x="940" y="220" width="80" height="190" fill="#F59E0B" rx="4"/>
  <text x="960" y="210" font-family="Segoe UI, sans-serif" font-size="10" fill="#B45309" font-weight="bold">4,800</text>
  <text x="945" y="430" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">At Risk VIP</text>

  <rect x="1060" y="140" width="80" height="270" fill="#94A3B8" rx="4"/>
  <text x="1075" y="130" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155" font-weight="bold">18,500</text>
  <text x="1055" y="430" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">Hibernating</text>

  <!-- Bottom: Strategic Playbook -->
  <rect x="24" y="480" width="1152" height="175" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="510" font-family="Segoe UI, sans-serif" font-size="13" fill="#0F172A" font-weight="bold">RFM Strategic Activation Playbook</text>
  <text x="44" y="535" font-family="Segoe UI, sans-serif" font-size="11" fill="#10B981" font-weight="bold">● Champions (1.9% base): $485.20 avg spend (3.5x platform avg) — Deploy VIP concierge, review incentives.</text>
  <text x="44" y="560" font-family="Segoe UI, sans-serif" font-size="11" fill="#0078D4" font-weight="bold">● Loyal Customers: $1.68M revenue — Reward with loyalty tier points and cross-category discovery vouchers.</text>
  <text x="44" y="585" font-family="Segoe UI, sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">● At Risk High-Value: $1.73M past spend — Deploy automated win-back triggers and CEO satisfaction surveys.</text>
  <text x="44" y="610" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748B" font-weight="bold">● Hibernating Buyers: $2.50M dormant revenue — Launch seasonal reactivation promos and clearance discounts.</text>
</svg>
